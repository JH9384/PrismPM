name: PrismPM OCI/native and Cargo publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer without a leading v
        required: true
        default: 0.3.0
        type: string
      publish-crates:
        description: Publish the already packaged crates through crates.io trusted publishing
        required: true
        default: false
        type: boolean
  push:
    tags:
      - v0.3.0

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  SDK_REPOSITORY: ghcr.io/uor-foundation/prismpm-sdk
  RUNTIME_REPOSITORY: ghcr.io/uor-foundation/prismpm-runtime

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish-crates: ${{ steps.version.outputs.publish-crates }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
      - id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
        run: |
          set -euo pipefail
          node scripts/release-phases.mjs policy >> "$GITHUB_OUTPUT"
          test "$(git status --porcelain)" = ""
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = 0.3.0
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        with:
          push: never
          runCmd: |
            set -euo pipefail
            bash scripts/vv.sh --with-sdk bash -euo pipefail -c "$(cat <<'PRISMPM_VV'
            node scripts/release-gate-evidence.mjs source-run . target/source-vv-evidence '${{ github.sha }}' amd64 - '${{ github.run_id }}' '${{ github.run_attempt }}' 1
            node scripts/release-gate-evidence.mjs source-run . target/source-vv-evidence '${{ github.sha }}' amd64 - '${{ github.run_id }}' '${{ github.run_attempt }}' 2
            PRISMPM_VV
            )"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-vv
          path: target/source-vv-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  images:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: sdk
            dockerfile: sdk/Dockerfile
            target: runtime
            repository: ghcr.io/uor-foundation/prismpm-sdk
          - name: runtime
            dockerfile: sdk/runtime/Dockerfile
            target: ""
            repository: ghcr.io/uor-foundation/prismpm-runtime
          - name: adapter-compose
            dockerfile: sdk/Dockerfile
            target: adapter-compose
            repository: ghcr.io/uor-foundation/prismpm-adapter-compose
          - name: adapter-kubernetes
            dockerfile: sdk/Dockerfile
            target: adapter-kubernetes
            repository: ghcr.io/uor-foundation/prismpm-adapter-kubernetes
          - name: adapter-github-pages
            dockerfile: sdk/Dockerfile
            target: adapter-github-pages
            repository: ghcr.io/uor-foundation/prismpm-adapter-github-pages
          - name: oracles
            dockerfile: sdk/Dockerfile
            target: oracles
            repository: ghcr.io/uor-foundation/prismpm-oracles
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Require the source-bound publication policy before registry credentials
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
        run: node scripts/release-phases.mjs policy
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
          REPOSITORY: ${{ matrix.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DOCKERFILE" = sdk/Dockerfile ]; then
            build=(node scripts/sdk-image-inputs.mjs build . "$GITHUB_SHA" "$TARGET")
          else
            test "$DOCKERFILE" = sdk/runtime/Dockerfile
            build=(docker buildx build --file "$DOCKERFILE")
          fi
          context=()
          if [ "$DOCKERFILE" = sdk/runtime/Dockerfile ]; then context=(.); fi
          "${build[@]}" --platform linux/amd64,linux/arm64 \
            --output "type=registry,name=$REPOSITORY,push-by-digest=true,name-canonical=true,rewrite-timestamp=true,oci-mediatypes=true" \
            --metadata-file "$RUNNER_TEMP/sdk-build.json" \
            --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 \
            --label org.opencontainers.image.created=1970-01-01T00:00:00Z \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" "${context[@]}"
          digest=$(node scripts/sdk-image-inputs.mjs digest "$RUNNER_TEMP/sdk-build.json")
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - id: platforms
        shell: bash
        env:
          IMAGE_INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$REPOSITORY@$IMAGE_INDEX_DIGEST" > "${{ matrix.name }}-image-index.json"
          for architecture in amd64 arm64; do
            child_digest=$(jq -er --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest' \
              "${{ matrix.name }}-image-index.json")
            case "$child_digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
            printf '%s=%s\n' "$architecture" "$child_digest" >> "$GITHUB_OUTPUT"
          done
      - id: sbom-amd64
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ matrix.repository }}@${{ steps.platforms.outputs.amd64 }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: ${{ matrix.name }}-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: sbom-arm64
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ matrix.repository }}@${{ steps.platforms.outputs.arm64 }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: ${{ matrix.name }}-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: attest-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Stage the image-index provenance bundle
        shell: bash
        env:
          PROVENANCE: ${{ steps.attest-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE" "${{ matrix.name }}-provenance.sigstore.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Install exact OCI transport and signature verifier tools
        run: |
          set -euo pipefail
          bash scripts/sdk-candidate.sh install-oras "$RUNNER_TEMP/release-tools"
          bash scripts/sdk-candidate.sh install-cosign "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      # Large SPDX remains a complete blob, with its small OCI 1.1 manifest
      # keylessly signed. This is not an inline SPDX attestation.
      - name: Publish and verify both complete platform SBOM artifacts
        env:
          IMAGE: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64 }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            if test "$architecture" = amd64; then digest=$AMD64_DIGEST; else digest=$ARM64_DIGEST; fi
            directory="$RUNNER_TEMP/release-sbom-$IMAGE-$architecture"
            prefix="$IMAGE-linux-$architecture"
            mkdir "$directory"
            cp "$IMAGE-image-index.json" "$directory/index.json"
            cp "$prefix.spdx.json" "$directory/sbom.spdx.json"
            oras manifest fetch "$REPOSITORY@$digest" --output "$directory/manifest.json"
            oras manifest fetch-config "$REPOSITORY@$digest" --output "$directory/config.json"
            node scripts/release-phases.mjs sbom-record "$directory" "$architecture" "$GITHUB_SHA" \
              "$REPOSITORY@$INDEX_DIGEST" "$GITHUB_REF"
            node scripts/release-phases.mjs sbom-publish "$directory" "$architecture" "$GITHUB_SHA" \
              "$REPOSITORY@$INDEX_DIGEST" "$GITHUB_REF" standards/trust/sigstore-trusted-root-cosign-3.1.3.json
            cmp "$directory/sbom.spdx.json" "$directory/sbom.received.spdx.json"
            for evidence in sbom-record.json sbom-manifest.json sbom-artifact.json sbom.sigstore.json sbom-signature-verification.json; do
              cp "$directory/$evidence" "$prefix.$evidence"
            done
            cp "$directory/manifest.json" "$prefix.image-manifest.json"
            cp "$directory/config.json" "$prefix.image-config.json"
          done
      - shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
          cosign sign --yes --oidc-provider github-actions \
            --trusted-root standards/trust/sigstore-trusted-root-cosign-3.1.3.json "$REPOSITORY@$DIGEST"
          node scripts/release-phases.mjs image-verify "$REPOSITORY@$DIGEST" "$GITHUB_SHA" "$GITHUB_REF" \
            standards/trust/sigstore-trusted-root-cosign-3.1.3.json >/dev/null
          docker pull "$REPOSITORY@$DIGEST"
          if [ "${{ matrix.name }}" = runtime ]; then
            test "$(docker run --rm --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" id -u)" != 0
            docker run --rm --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" node /opt/prismpm/runtime/runtime.mjs help
          else
            # The default initializer uses only its ordinary setuid/setgid
            # capability to adapt an optional Docker-socket group, then execs
            # the command as UID 1000. Explicit non-root invocations require
            # no capabilities at all, as used by the Action below.
            test "$(docker run --rm "$REPOSITORY@$DIGEST" id -u)" = 1000
            test "$(docker run --rm "$REPOSITORY@$DIGEST" sh -lc 'printf %s "$HOME"')" = /home/vscode
            docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" prismpm --version
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$REPOSITORY@$DIGEST" docker version --format '{{.Server.Version}}'
            case "${{ matrix.name }}" in
              adapter-compose) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/compose.json ;;
              adapter-kubernetes) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/kubernetes.json ;;
              adapter-github-pages) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/github-pages.json ;;
              oracles) docker run --rm "$REPOSITORY@$DIGEST" test -x /usr/local/bin/oci-distribution-conformance ;;
            esac
          fi
          printf '%s@%s\n' "$REPOSITORY" "$DIGEST" > "${{ matrix.name }}-image.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-image
          path: ${{ matrix.name }}-image.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-supply-chain
          path: |
            ${{ matrix.name }}-image-index.json
            ${{ matrix.name }}-linux-amd64.spdx.json
            ${{ matrix.name }}-linux-arm64.spdx.json
            ${{ matrix.name }}-linux-amd64.sbom.sigstore.json
            ${{ matrix.name }}-linux-arm64.sbom.sigstore.json
            ${{ matrix.name }}-linux-*.sbom-record.json
            ${{ matrix.name }}-linux-*.sbom-manifest.json
            ${{ matrix.name }}-linux-*.sbom-artifact.json
            ${{ matrix.name }}-linux-*.sbom-signature-verification.json
            ${{ matrix.name }}-linux-*.image-manifest.json
            ${{ matrix.name }}-linux-*.image-config.json
            ${{ matrix.name }}-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 30

  reproducibility:
    needs: [gate, images]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: runtime
            name: sdk-amd64
            image: sdk
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: runtime
            name: sdk-arm64
            image: sdk
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/runtime/Dockerfile
            target: ""
            name: runtime-amd64
            image: runtime
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/runtime/Dockerfile
            target: ""
            name: runtime-arm64
            image: runtime
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-compose
            name: adapter-compose-amd64
            image: adapter-compose
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-compose
            name: adapter-compose-arm64
            image: adapter-compose
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-kubernetes
            name: adapter-kubernetes-amd64
            image: adapter-kubernetes
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-kubernetes
            name: adapter-kubernetes-arm64
            image: adapter-kubernetes
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-github-pages
            name: adapter-github-pages-amd64
            image: adapter-github-pages
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-github-pages
            name: adapter-github-pages-arm64
            image: adapter-github-pages
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: oracles
            name: oracles-amd64
            image: oracles
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: oracles
            name: oracles-arm64
            image: oracles
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-a
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-b
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.image }}-image
          path: .shipped-image
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.gate.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          identity_file=".shipped-image/$IMAGE-image.txt"
          identity=$(cat "$identity_file")
          docker buildx imagetools inspect --raw "$identity" > shipped-index.json
          for root in root-a root-b; do
            context=()
            if [ "$DOCKERFILE" = sdk/Dockerfile ]; then
              build=(node "$root/scripts/sdk-image-inputs.mjs" build "$root" "$GITHUB_SHA" "$TARGET")
            else
              test "$DOCKERFILE" = sdk/runtime/Dockerfile
              build=(docker buildx build --file "$root/$DOCKERFILE")
              context=("$root")
            fi
            "${build[@]}" --no-cache --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 \
              --label "org.opencontainers.image.created=1970-01-01T00:00:00Z" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" \
              --platform "$PLATFORM" \
              --output "type=oci,dest=$root.oci.tar,rewrite-timestamp=true,oci-mediatypes=true" "${context[@]}"
            mkdir "$root.oci"
            tar -xf "$root.oci.tar" -C "$root.oci"
            jq -r '.manifests[0].digest' "$root.oci/index.json" > "$root.digest"
          done
          cmp root-a.digest root-b.digest
          cmp root-a.oci/index.json root-b.oci/index.json
          node root-a/scripts/release-phases.mjs reproducibility \
            "$identity_file" shipped-index.json "${PLATFORM#linux/}" "$GITHUB_SHA" \
            root-a.oci root-b.oci > "${{ matrix.name }}-reproducibility.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-${{ matrix.name }}
          path: ${{ matrix.name }}-reproducibility.txt
          if-no-files-found: error
          retention-days: 30
      - name: Verify exact current SDK browser closure offline and read-only
        if: matrix.image == 'sdk'
        shell: bash
        env:
          RESULT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          bash root-a/scripts/browser-api-sdk-check.sh "$(cat .shipped-image/sdk-image.txt)" "$GITHUB_SHA" > "$RESULT_NAME-browser-sdk.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.image == 'sdk'
        with:
          name: browser-sdk-${{ matrix.name }}
          path: ${{ matrix.name }}-browser-sdk.log
          if-no-files-found: error
          retention-days: 30
      - name: Verify exact current SDK native-library closure offline and read-only
        if: matrix.image == 'sdk'
        shell: bash
        env:
          RESULT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          node root-a/scripts/library-sdk-check.mjs tests
          bash root-a/scripts/library-sdk-check.sh "$(cat .shipped-image/sdk-image.txt)" "$GITHUB_SHA" > "$RESULT_NAME-library-sdk.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.image == 'sdk'
        with:
          name: library-sdk-${{ matrix.name }}
          path: ${{ matrix.name }}-library-sdk.log
          if-no-files-found: error
          retention-days: 30
  installed-sdk:
    needs: [gate, images]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-a
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
          path: .shipped-image
      - name: Verify both complete installed-SDK runs on the native isolated runner
        shell: bash
        env:
          RESULT_NAME: sdk-${{ matrix.arch }}
          NATIVE_PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -euo pipefail
          node root-a/scripts/sdk-vv-check.mjs tests
          node root-a/scripts/sdk-vv-check.mjs run "$(cat .shipped-image/sdk-image.txt)" \
            "$GITHUB_SHA" "${NATIVE_PLATFORM#linux/}" "$RESULT_NAME-full-sdk-vv"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-sdk-vv-sdk-${{ matrix.arch }}
          path: sdk-${{ matrix.arch }}-full-sdk-vv/
          if-no-files-found: error
          retention-days: 30
      - name: Verify genuine installed product CLI and source-free browser release
        shell: bash
        env:
          RESULT_NAME: sdk-${{ matrix.arch }}
        run: |
          set -euo pipefail
          node root-a/scripts/product-sdk-check.mjs tests
          bash root-a/scripts/product-sdk-check.sh "$(cat .shipped-image/sdk-image.txt)" \
            "$GITHUB_SHA" "$RESULT_NAME-product-cli"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-cli-sdk-${{ matrix.arch }}
          path: sdk-${{ matrix.arch }}-product-cli/
          if-no-files-found: error
          retention-days: 30

  native:
    needs: [gate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - platform: linux/arm64
            target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
          path: .release-sdk
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/sdk-image-inputs.mjs build . "$GITHUB_SHA" cli-archive \
            --build-arg "SDK_VERSION=$VERSION" \
            --platform "$PLATFORM" \
            --output type=local,dest=.native-release
          archive=$(find .native-release -maxdepth 1 -type f -name 'prismpm-*.tar.gz' -print)
          test -n "$archive"
          test -f "$archive.sha256"
          docker run --rm \
            --mount "type=bind,source=$PWD/.native-release,target=/release,readonly" \
            docker.io/library/debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            sh -ec 'cd /release && sha256sum --check "$(basename "$1").sha256"' sh "$archive"
          sdk_image=$(cat .release-sdk/sdk-image.txt)
          case "$sdk_image" in
            ghcr.io/uor-foundation/prismpm-sdk@sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf 'invalid SDK image identity: %s\n' "$sdk_image" >&2; exit 64 ;;
          esac
          mkdir .native-cli
          tar --extract --gzip --file "$archive" --directory .native-cli
          node scripts/release-gate-evidence.mjs native . .native-equivalence "$GITHUB_SHA" \
            "${PLATFORM#linux/}" "$sdk_image" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$archive"
          mv "$archive" "$archive.sha256" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sdk-equivalence-${{ matrix.arch }}
          path: .native-equivalence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: |
            prismpm-*.tar.gz
            prismpm-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  oci-native:
    name: publish source-addressed OCI/native verification assets
    needs: [gate, images, native, reproducibility, installed-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false
      - name: Require the source-bound publication policy
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
        run: node scripts/release-phases.mjs policy
      - name: Require every original non-Cargo prerequisite
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-phases.mjs prerequisites oci-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-image'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-supply-chain'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: reproducibility-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: full-sdk-vv-sdk-amd64
          path: .sdk-gate-evidence/full-sdk-vv-sdk-amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: full-sdk-vv-sdk-arm64
          path: .sdk-gate-evidence/full-sdk-vv-sdk-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-cli-sdk-amd64
          path: .sdk-gate-evidence/product-cli-sdk-amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-cli-sdk-arm64
          path: .sdk-gate-evidence/product-cli-sdk-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-sdk-sdk-amd64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-sdk-sdk-arm64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: library-sdk-sdk-amd64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: library-sdk-sdk-arm64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-vv
          path: .sdk-gate-evidence/source-vv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-equivalence-amd64
          path: .sdk-gate-evidence/native-equivalence-sdk-amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-equivalence-arm64
          path: .sdk-gate-evidence/native-equivalence-sdk-arm64
      - name: Preserve complete native SDK gate evidence without changing acceptance scope
        shell: bash
        run: |
          set -euo pipefail
          image=$(cat release/sdk-image.txt)
          node scripts/sdk-release-evidence.mjs source-vv .sdk-gate-evidence/source-vv \
            release/source-vv.tar - "$GITHUB_SHA" amd64 "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          for architecture in amd64 arm64; do
            for kind in full-sdk-vv product-cli; do
              node scripts/sdk-release-evidence.mjs "$kind" \
                ".sdk-gate-evidence/$kind-sdk-$architecture" "release/sdk-$architecture-$kind.tar" \
                "$image" "$GITHUB_SHA" "$architecture"
            done
            node scripts/sdk-release-evidence.mjs native-equivalence \
              ".sdk-gate-evidence/native-equivalence-sdk-$architecture" "release/sdk-$architecture-native-equivalence.tar" \
              "$image" "$GITHUB_SHA" "$architecture" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          done
      - shell: bash
        run: |
          set -euo pipefail
          cd release
          checksums=$(mktemp)
          trap 'rm -f "$checksums"' EXIT
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$checksums"
          mv "$checksums" SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: release/prismpm-*.tar.gz
      - name: Publish only exact unaccepted verification assets; never overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
        run: node scripts/release-phases.mjs publish-oci release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-native-publication
          path: release/*
          if-no-files-found: error
          retention-days: 30

  crates:
    if: ${{ needs.gate.outputs.publish-crates == 'true' }}
    needs: [gate, images, native, reproducibility, installed-sdk, oci-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: crates.io
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Require the source-bound publication policy before Cargo credentials
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
        run: node scripts/release-phases.mjs policy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
          path: .release-sdk
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          sdk_image=$(cat .release-sdk/sdk-image.txt)
          case "$sdk_image" in
            ghcr.io/uor-foundation/prismpm-sdk@sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf 'invalid SDK release identity: %s\n' "$sdk_image" >&2; exit 64 ;;
          esac
          docker run --rm \
            --user 1000:1000 \
            --env CARGO_REGISTRY_TOKEN \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace \
            --entrypoint /bin/bash \
            "$sdk_image" \
            -euo pipefail -c '
              wait_for_crate() {
                package=$1 version=$2
                for attempt in $(seq 1 90); do
                  code=$(curl --user-agent prismpm-release/0.3 \
                    --silent --output /dev/null --write-out "%{http_code}" \
                    "https://crates.io/api/v1/crates/$package/$version")
                  if [ "$code" = 200 ]; then return 0; fi
                  sleep 10
                done
                printf "crates.io did not expose %s %s after publication\n" "$package" "$version" >&2
                return 1
              }
              public_checksum() {
                package=$1 version=$2
                response=$(mktemp)
                code=$(curl --user-agent prismpm-release/0.3 --silent --show-error \
                  --output "$response" --write-out "%{http_code}" \
                  "https://crates.io/api/v1/crates/$package/$version")
                if [ "$code" = 404 ]; then
                  rm -f "$response"
                  return 1
                fi
                test "$code" = 200
                node -e "const fs=require(\"node:fs\"); const checksum=JSON.parse(fs.readFileSync(process.argv[1],\"utf8\")).version?.checksum; if (!/^[0-9a-f]{64}$/.test(checksum ?? \"\")) process.exit(2); process.stdout.write(checksum + \"\\n\");" "$response"
                rm -f "$response"
              }
              publish_exact() {
                package=$1 version=$2 manifest=$3 archive=$4 expected=$5
                package_target=${archive%/package/*}
                test "$archive" = "$package_target/package/$package-$version.crate"
                cargo package --locked --manifest-path "$manifest" --target-dir "$package_target"
                test -f "$archive"
                if [ "$expected" != - ]; then
                  cmp "$archive" "$expected"
                fi
                local_checksum=$(sha256sum "$archive" | cut -d" " -f1)
                if observed=$(public_checksum "$package" "$version"); then
                  test "$observed" = "$local_checksum"
                  return 0
                fi
                cargo publish --locked --manifest-path "$manifest" --target-dir "$package_target"
                wait_for_crate "$package" "$version"
                observed=$(public_checksum "$package" "$version")
                test "$observed" = "$local_checksum"
              }
              # Independently released inputs must be public before a fresh
              # crates.io consumer can resolve the packaged PrismPM manifest.
              wait_for_crate lexlean 0.3.0
              release_parent=$(mktemp -d)
              release_sources="$release_parent/release-crates"
              ./scripts/package-release-crates.sh --prepare "$release_sources"
              publish_exact prod-ir 0.1.0 \
                "$release_sources/lean4-prod/prod-ir/Cargo.toml" \
                "$release_sources/lean4-prod/target/package/prod-ir-0.1.0.crate" \
                "$PWD/vendor/lean4-prod/crates/prod-ir-0.1.0.crate"
              publish_exact prod-codegen 0.1.0 \
                "$release_sources/lean4-prod/prod-codegen/Cargo.toml" \
                "$release_sources/lean4-prod/target/package/prod-codegen-0.1.0.crate" \
                "$PWD/vendor/lean4-prod/crates/prod-codegen-0.1.0.crate"
              publish_exact prism-stdlib 0.2.0 \
                "$release_sources/stdlib/Cargo.toml" \
                "$release_sources/stdlib/target/package/prism-stdlib-0.2.0.crate" \
                "$PWD/stdlib/generated/prism-stdlib-0.2.0.crate"
              publish_exact prismpm 0.3.0 crates/prismpm/Cargo.toml \
                "$PWD/target/package/prismpm-0.3.0.crate" -
              rm -rf "$release_parent"
            '

  release:
    needs: [gate, images, native, reproducibility, installed-sdk, oci-native, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Require the source-bound publication policy before versioned aliases
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
        run: node scripts/release-phases.mjs policy
      - name: Require the complete Cargo-dependent publication prerequisites
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-phases.mjs prerequisites release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-image'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-supply-chain'
          path: release
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish accepted OCI discovery tags
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          for identity_file in release/*-image.txt; do
            identity=$(cat "$identity_file")
            case "$identity" in
              ghcr.io/uor-foundation/*@sha256:????????????????????????????????????????????????????????????????) ;;
              *) printf 'invalid release image identity: %s\n' "$identity" >&2; exit 64 ;;
            esac
            repository=${identity%@*}
            expected=${identity##*@}
            docker buildx imagetools create --tag "$repository:$VERSION" "$identity"
            observed=$(docker buildx imagetools inspect "$repository:$VERSION" \
              --format '{{.Manifest.Digest}}')
            test "$observed" = "$expected"
          done
      - shell: bash
        run: |
          set -euo pipefail
          find release -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: release/prismpm-*.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            release/*
