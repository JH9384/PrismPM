reference = "https://www.iso.org/standard/74393.html"
basis = "public-catalog"
scope = "Architecture description conceptual foundations and view/viewpoint framework"
provenance = "ISO/IEC/IEEE international standard catalog entry"
interpretation = "Architecture descriptions are modeled as collections of concerns, viewpoints, views, models, and stakeholders. Design views in OPM and UML are 42010 views whose elements must name declarations of the system model. Holo and text-application metadata are Prism-owned specializations in this vocabulary, not ISO-defined wire formats or user-interface contracts."
