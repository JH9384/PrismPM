name: feature intake

# Triages a feature request filed with .github/ISSUE_TEMPLATE/feature_request.yml
# (or with the same `### Heading` sections from `gh issue create`, see
# CONTRIBUTING.md):
#   - "Submitted by: AI agent" adds `agent-submitted`;
#   - "Component" adds the matching `area/*` label;
#   - an empty "Acceptance test" keeps `triage/needs-information` and asks for
#     one in a comment (once); a filled one removes that label.
# The issue body is read through the event payload only; nothing from it is
# interpolated into a shell, so a hostile body cannot run commands.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: triage feature request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Form-shaped bodies on open or edit; any new kind/feature issue on open.
    # Older kind/feature issues without the form sections are left alone when
    # edited, and tracking issues are never triaged here.
    if: >-
      !contains(github.event.issue.labels.*.name, 'tracking') &&
      (contains(github.event.issue.body, '### Submitted by') ||
       (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'kind/feature')))
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body ?? '';
            const NEEDS = 'triage/needs-information';
            const MARKER = '<!-- feature-intake:acceptance-test -->';
            const AREAS = ['cli', 'engine', 'holo-format', 'verify', 'runtime-js',
              'runtime-rust', 'runtime-py', 'spec', 'docs', 'site'];

            // The form renders each field as "### Label" followed by its value;
            // an empty optional field renders as "_No response_".
            const sections = {};
            const parts = body.split(/^###[ \t]+/m).slice(1);
            for (const part of parts) {
              const nl = part.indexOf('\n');
              const head = (nl < 0 ? part : part.slice(0, nl)).trim().toLowerCase();
              sections[head] = nl < 0 ? '' : part.slice(nl + 1).trim();
            }
            const value = (name) => {
              const raw = sections[name.toLowerCase()];
              if (raw === undefined) return undefined;
              const text = raw.replace(/^```[^\n]*\n?/, '').replace(/\n?```$/, '').trim();
              return text === '' || text === '_No response_' ? '' : text;
            };

            const owner = context.repo.owner, repo = context.repo.repo, issue_number = issue.number;
            const have = new Set(issue.labels.map((l) => l.name));
            const add = [];

            if ((value('Submitted by') ?? '').toLowerCase() === 'ai agent') add.push('agent-submitted');

            const component = (value('Component') ?? '').toLowerCase();
            if (AREAS.includes(component)) add.push(`area/${component}`);

            const acceptance = value('Acceptance test');
            const missing = !acceptance;
            if (missing) add.push(NEEDS);

            const toAdd = add.filter((l) => !have.has(l));
            if (toAdd.length) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            core.info(`labels added: ${toAdd.join(', ') || 'none'}`);

            if (!missing && have.has(NEEDS)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: NEEDS }).catch((e) => {
                if (e.status !== 404) throw e;
              });
              core.info(`removed ${NEEDS}`);
            }

            if (missing) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              if (!comments.some((c) => (c.body ?? '').includes(MARKER))) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: [
                  MARKER,
                  'Thanks for the request. It has no **Acceptance test** yet, so it stays `triage/needs-information`.',
                  '',
                  'Please edit the issue and add, under `### Acceptance test`, a snippet that should pass once this ships: a test, a command with its expected output, or an assertion. The label is removed automatically when you do.',
                ].join('\n') });
              }
            }
