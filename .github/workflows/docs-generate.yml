name: docs generate

# The Reference and API docs under docs/generated are produced by
# sdk/docs/generate.mjs from @prism-code/spec, sdk/docs/cli.json and the
# executed prism-code examples. This workflow regenerates them and fails on
# any difference, names the page, and runs the vocabulary lint and the
# generator's own tests. It never commits: main is unprotected, and a bot
# commit would hide drift instead of catching it. The author regenerates in
# the same pull request that changed a source.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-generate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: generated docs are current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      # The generator reads the spec package from the commit pinned in
      # sdk/docs/spec.lock.json and fetches that commit by hash when the
      # checkout does not have it.
      - name: Regenerate and diff against docs/generated
        run: node sdk/docs/generate.mjs --check
      - name: Vocabulary lint
        run: node sdk/docs/lint.mjs
      - name: Generator tests
        run: node --test "sdk/docs/test/*.test.mjs"
