# Generated by the Prism factory from prism-factory/model/src/Factory/Delegation.lex.tex.
# Do not edit: `prism-factory/factory.sh workflow --name delegate --write .github/workflows/prism-delegation.yml` rewrites it; `check` refuses drift.
# GitHub is the forge: it triggers, identifies each obligation with the certified
# core and verifies receipts. Nothing here is a hosted server. A receipt counts
# when a workflow of this repository or a listed maintainer signed it keylessly
# for exactly this identity, wherever it was established (a lent runner or a
# workstation on the same SDK image). Only obligations with no counted receipt
# are established, each on its own lent runner through the PrismPM Action.
name: Prism delegation
on:
  pull_request:
  push:
    branches: [main, 'release/v*']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prism-delegation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      establish: ${{ steps.plan.outputs.establish }}
      sdk-image: ${{ steps.plan.outputs.sdk-image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Identify every obligation and count its receipts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash prism-factory/factory.sh forge-plan
  establish:
    needs: [plan]
    if: ${{ needs.plan.outputs.establish != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        obligation: ${{ fromJSON(needs.plan.outputs.establish) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Materialize the obligation's closure
        id: closure
        run: bash prism-factory/factory.sh forge-prepare ${{ matrix.obligation }}
      - name: Establish the obligation in the immutable SDK image
        id: establish
        uses: ./action
        with:
          sdk-image: ${{ needs.plan.outputs.sdk-image }}
          command: factory
          target: ${{ matrix.obligation }}
          context: ${{ steps.closure.outputs.context }}
        env:
          PRISMPM_ACTION_REGISTRY_TOKEN: ${{ github.token }}
      - name: Write the receipt
        id: receipt
        env:
          FACTORY_RESULT: ${{ steps.establish.outputs.result }}
        run: bash prism-factory/factory.sh forge-receipt ${{ matrix.obligation }}
      - name: Sign the receipt keylessly
        id: sign
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ steps.receipt.outputs.receipt }}
      - name: Place the bundle beside the receipt
        env:
          FACTORY_BUNDLE: ${{ steps.sign.outputs.bundle-path }}
        run: bash prism-factory/factory.sh forge-bundle ${{ matrix.obligation }}
      - name: Hand the receipt and its bundle to the forge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receipt-${{ matrix.obligation }}
          path: target/factory/fresh/${{ matrix.obligation }}
  report:
    needs: [plan, establish]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Collect the receipts the peers established
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: receipt-*
          path: target/factory/fresh
          merge-multiple: true
      - name: Verify every receipt and report the check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash prism-factory/factory.sh forge-report
  keep:
    needs: [report]
    if: ${{ always() && needs.report.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Collect the receipts the peers established
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: receipt-*
          path: target/factory/fresh
          merge-multiple: true
      - name: Keep every verified receipt on the receipts branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash prism-factory/factory.sh forge-keep
