name: npm verify

# The offline verifier in sdk/npm/verify. Short, path-filtered and outside the
# devcontainer, like npm-prism-code.yml and npm-spec.yml. It also runs when
# the files it copies change (the spec package, prism-code's BLAKE3) or the
# reader, inspection and fixtures its tests compare against, because its tests and the
# vendor check fail when a copy drifts. There is no publish job.

on:
  pull_request:
    paths:
      - sdk/npm/verify/**
      - sdk/npm/spec/**
      - sdk/npm/prism-code/src/archive.mjs
      - sdk/npm/prism-code/src/blake3.mjs
      - sdk/npm/prism-code/src/inspect.mjs
      - sdk/npm/prism-code/test/fixtures/Calculator.inspect.json
      - sdk/npm/prism-code/fixtures/**
      - sdk/npm/prism-code/test/blake3-vectors.json
      - .github/workflows/npm-verify.yml
  push:
    branches: [main]
    paths:
      - sdk/npm/verify/**
      - sdk/npm/spec/**
      - sdk/npm/prism-code/src/archive.mjs
      - sdk/npm/prism-code/src/blake3.mjs
      - sdk/npm/prism-code/src/inspect.mjs
      - sdk/npm/prism-code/test/fixtures/Calculator.inspect.json
      - sdk/npm/prism-code/fixtures/**
      - sdk/npm/prism-code/test/blake3-vectors.json
      - .github/workflows/npm-verify.yml

permissions:
  contents: read

concurrency:
  group: npm-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk/npm/verify

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      # sdk/npm/spec/index.mjs and index.d.ts are generated from the files in the
      # package and are not committed. Build them before anything imports the package.
      - name: Build the spec package's generated entry point
        working-directory: sdk/npm/spec
        run: npm run build
      - name: Unit tests
        run: node --test "test/*.test.mjs"
      - name: Vendored copies are current
        run: node scripts/vendor.mjs --check
      - name: browser.js is current
        run: node scripts/build-browser.mjs --check
      - name: Package size and contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e '
            const pack = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0];
            console.log(`unpacked size: ${pack.unpackedSize} bytes, ${pack.entryCount} files`);
            if (pack.unpackedSize > 307200) throw new Error("package exceeds 300 KiB");
            const paths = pack.files.map((f) => f.path);
            const stray = paths.filter((p) => /^(test|scripts)\//.test(p));
            if (stray.length) throw new Error(`tests or scripts in the package: ${stray}`);
            for (const required of ["browser.js", "index.d.ts", "src/index.mjs", "README.md", "LICENSE"]) {
              if (!paths.includes(required)) throw new Error(`missing from the package: ${required}`);
            }
          '
          rm pack.json
      - name: The entry points import cleanly
        shell: bash
        run: |
          set -euo pipefail
          for entry in ./src/index.mjs ./browser.js; do
            node --input-type=module -e "import('$entry').then(m => { if (typeof m.verify !== 'function' || typeof m.inspect !== 'function' || m.FORMAT_REVISION !== '2026-10-23') throw new Error('$entry') })"
          done
