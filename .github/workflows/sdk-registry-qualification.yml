name: Qualify owned SDK registry TLS

on:
  pull_request:
    paths:
      - .github/workflows/sdk-registry-qualification.yml
      - scripts/sdk-registry-qualification.mjs
      - scripts/sdk-registry-qualification.test.mjs
      - scripts/sdk-registry-reader.mjs
      - scripts/sdk-vv-check.mjs
      - scripts/sdk-vv-check.test.mjs
      - scripts/sdk-process-qualification.mjs
      - scripts/sdk-command-owner.*
      - scripts/sdk-vv-outer.sh
      - scripts/sdk-construction-*.mjs
      - scripts/sdk-candidate.mjs
      - scripts/sdk-candidate-sbom.mjs
      - scripts/sdk-candidate.sh
      - sdk/Dockerfile
      - sdk/vv-runtime.lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-registry-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=docker.io/moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - name: Build only pinned native transport tools
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker buildx build --file sdk/Dockerfile --target registry_qualification_tools \
            --platform linux/${{ matrix.arch }} --load --tag prism-registry-tools:$SOURCE_REVISION .
      - name: Verify complete native outer process owner
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALIFICATION_ARCH: ${{ matrix.arch }}
        run: |
          out="$RUNNER_TEMP/outer-process-owner"
          mkdir -m 0700 "$out"
          mkdir -m 0700 "$out/results"
          owner="prism-outer-owner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.arch }}"
          network="$owner-network"
          network_id= container_id= cleaning=0 cleanup_deadline=0
          controlled() {
            local tag=$1 bound=10 status remaining
            shift
            if (( cleaning )); then
              remaining=$((cleanup_deadline - SECONDS))
              (( remaining > 0 )) || return 124
              (( remaining >= bound )) || bound=$remaining
            fi
            if timeout --signal=TERM --kill-after=2s "${bound}s" docker "$@" >"$out/$tag.stdout" 2>"$out/$tag.stderr"; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$status" >"$out/$tag.status"
            cat "$out/$tag.stdout"
            return "$status"
          }
          absent() {
            local tag=$1 kind=$2 reference=$3 status diagnostic
            if controlled "$tag" "$kind" inspect "$reference"; then
              return 1
            else
              status=$?
            fi
            test "$status" = 1 || return 1
            diagnostic=$(cat "$out/$tag.stderr")
            [[ $diagnostic =~ [Nn]o[[:space:]]such[[:space:]](object|container|network)|[Nn]etwork.*not[[:space:]]found ]]
          }
          cleanup() {
            local status=$? actual id
            trap - EXIT
            cleaning=1 cleanup_deadline=$((SECONDS + 60))
            if controlled container-survivor container inspect "$owner"; then
              test -n "$container_id" || exit 1
              id=$(controlled container-survivor-id container inspect "$owner" --format '{{.Id}}')
              test "$id" = "$container_id" || exit 1
              test "$(cat "$out/container.id")" = "$container_id" || exit 1
              actual=$(controlled container-survivor-label container inspect "$container_id" --format '{{index .Config.Labels "org.uor.prismpm.outer-owner"}}')
              test "$actual" = "$owner" || exit 1
              controlled container-removal container rm --force --volumes "$container_id" || exit 1
              status=1
            fi
            absent container-name-absence container "$owner" || exit 1
            if test -n "$container_id"; then absent container-id-absence container "$container_id" || exit 1; fi
            if test -n "$network_id"; then
              id=$(controlled network-original-id network inspect "$network" --format '{{.Id}}')
              test "$id" = "$network_id" || exit 1
              actual=$(controlled network-original-label network inspect "$network_id" --format '{{index .Labels "org.uor.prismpm.outer-owner"}}')
              test "$actual" = "$owner" || exit 1
              controlled network-removal network rm "$network_id" || exit 1
              absent network-id-absence network "$network_id" || exit 1
            fi
            absent network-name-absence network "$network" || exit 1
            printf '%s\n' "$status" >"$out/cleanup.status"
            exit "$status"
          }
          trap cleanup EXIT
          absent prior-network network "$network"
          absent prior-container container "$owner"
          network_id=$(controlled network-create network create --label "org.uor.prismpm.outer-owner=$owner" "$network")
          [[ $network_id =~ ^[a-f0-9]{64}$ ]]
          printf '%s\n' "$network_id" >"$out/network.id"
          image=$(controlled image-inspect image inspect prism-registry-tools:$SOURCE_REVISION --format '{{.Id}}')
          [[ $image =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$image" >"$out/image.id"
          container_id=$(controlled container-create create --rm --init --name "$owner" --cidfile "$out/container.id" \
            --label "org.uor.prismpm.outer-owner=$owner" --network "$network" \
            --read-only --cpus 2 --memory 1g --memory-swap 1g --pids-limit 256 \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=16g,mode=1777 \
            --mount type=bind,source=$PWD,target=/source,readonly \
            --mount type=bind,source=$out/results,target=/evidence --workdir /source \
            --env GITHUB_ACTIONS --env RUNNER_ENVIRONMENT --env RUNNER_OS --env RUNNER_ARCH \
            --env SOURCE_REVISION --env QUALIFICATION_ARCH --entrypoint timeout \
            "$image" --signal=TERM --kill-after=5s 240s node scripts/sdk-process-qualification.mjs)
          [[ $container_id =~ ^[a-f0-9]{64}$ ]]
          test "$(cat "$out/container.id")" = "$container_id"
          controlled container-initial container inspect "$container_id" >"$out/container-initial.json"
          timeout --signal=TERM --kill-after=5s 260s docker start --attach "$container_id" \
            >"$out/docker.stdout" 2>"$out/docker.stderr"
          timeout --signal=TERM --kill-after=2s 10s node --input-type=module -e 'import assert from "node:assert/strict";import{constants,openSync,fstatSync,readFileSync,closeSync}from"node:fs";const fd=openSync(process.argv[1],constants.O_RDONLY|constants.O_NOFOLLOW|constants.O_NONBLOCK);try{const s=fstatSync(fd);assert(s.isFile()&&s.nlink===1&&s.size<=65536);const r=JSON.parse(readFileSync(fd));assert.equal(r.passed,true);assert.equal(r.status,0);assert.equal(r.signal,null);assert.equal(r.source_unchanged,true);assert.equal(r.source,process.env.SOURCE_REVISION);const after=fstatSync(fd);for(const key of ["dev","ino","mode","nlink","size","mtimeMs","ctimeMs"])assert.equal(after[key],s[key])}finally{closeSync(fd)}' "$out/results/completed.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-outer-process-owner-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/outer-process-owner/
          if-no-files-found: error
          retention-days: 14
      - name: Qualify real registry and fresh native daemons
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALIFICATION_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -m 2770 "$RUNNER_TEMP/registry-qualification"
          image=$(docker image inspect prism-registry-tools:$SOURCE_REVISION --format '{{.Id}}')
          docker run --rm --init --stop-timeout 180 --read-only --cpus 2 --memory 1g --memory-swap 1g \
            --user 0:0 --group-add "$(id -g)" \
            --label org.uor.prismpm.registry-qualification-tools=$SOURCE_REVISION \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777 \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            --mount type=bind,source=$PWD,target=/source,readonly \
            --mount type=bind,source=$RUNNER_TEMP/registry-qualification,target=$RUNNER_TEMP/registry-qualification \
            --workdir /source \
            --env GITHUB_ACTIONS --env RUNNER_ENVIRONMENT --env RUNNER_OS --env RUNNER_ARCH \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env SOURCE_REVISION --env QUALIFICATION_ARCH \
            "$image" node scripts/sdk-registry-qualification.mjs "$RUNNER_TEMP/registry-qualification"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sdk-registry-qualification-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/registry-qualification/public/
          if-no-files-found: error
          retention-days: 14
