name: Reproducibility Gate

# Two-root output comparison is already gate 12 of the main-push `just vv`.
# This standalone job is the nightly drift detector on main (and an on-demand
# check for any ref); it no longer runs on pull requests.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    # Measured 45-50 minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compare complete platform-independent outputs in two absolute roots
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          runCmd: cargo xtask check-reproducibility
