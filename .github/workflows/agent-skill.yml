name: agent skill

# The Agent Skill for Prism, skills/prism/SKILL.md, and the command an agent
# runs to get it. The skill's blocks are generated by sdk/docs/skill.mjs from
# sdk/docs/cli.json; docs-generate.yml already fails a pull request whose skill
# names a command that does not ship. This workflow checks the other half on a
# clean machine:
#   - `npx skills add` installs the skill from this checkout and from its public
#     source, the GitHub tree URL of the commit under test (and, on main, the
#     owner/repo shorthand the site shows), and the installed file is the file
#     in the repository;
#   - every command the skill tells an agent to try runs against the prism-code
#     that npm serves.
# A weekly run repeats the public installs with the newest `skills` CLI, so a
# change in how it resolves sources shows here before an agent hits it.

on:
  pull_request:
    paths:
      - skills/**
      - sdk/docs/**
      - sdk/npm/prism-code/**
      - .github/workflows/agent-skill.yml
  push:
    branches: [main]
    paths:
      - skills/**
      - sdk/docs/**
      - sdk/npm/prism-code/**
      - .github/workflows/agent-skill.yml
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: agent-skill-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_TELEMETRY: '1'
  # The version the pull request and push runs pin; the weekly run uses latest.
  SKILLS_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '1.7.4' }}

jobs:
  install:
    name: npx skills add on a clean machine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: The skill names only shipped commands and its blocks are current
        run: node sdk/docs/skill.mjs --check
      - name: Install from this checkout
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          clean="$(mktemp -d)"
          cd "$clean"
          git init -q
          npx --yes "skills@$SKILLS_VERSION" add "$GITHUB_WORKSPACE" --list | tee list.txt
          grep -q 'prism' list.txt
          npx --yes "skills@$SKILLS_VERSION" add "$GITHUB_WORKSPACE" --skill prism -a claude-code --copy -y
          diff -u "$GITHUB_WORKSPACE/skills/prism/SKILL.md" .claude/skills/prism/SKILL.md
          echo "installed .claude/skills/prism/SKILL.md, identical to the repository's"
      # The public source of the commit under test: a pull request's head
      # commit, the pushed commit on main. For the weekly run it is main.
      - name: Install from the public GitHub source
        shell: bash
        env:
          REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          clean="$(mktemp -d)"
          cd "$clean"
          git init -q
          npx --yes "skills@$SKILLS_VERSION" add "https://github.com/$REPO/tree/$REF/skills/prism" -a claude-code --copy -y
          diff -u "$GITHUB_WORKSPACE/skills/prism/SKILL.md" .claude/skills/prism/SKILL.md
          echo "installed from https://github.com/$REPO/tree/$REF/skills/prism"
      # What the site's "For agents" line shows. It resolves the default branch,
      # so it can only be checked once the skill is on main.
      - name: Install with the owner/repo shorthand
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          clean="$(mktemp -d)"
          cd "$clean"
          git init -q
          npx --yes "skills@$SKILLS_VERSION" add "$GITHUB_REPOSITORY" --skill prism -a claude-code --copy -y
          test -f .claude/skills/prism/SKILL.md
          grep -q '^name: prism$' .claude/skills/prism/SKILL.md
          echo "installed with: npx skills add $GITHUB_REPOSITORY --skill prism"
      - name: Run every command the skill tells an agent to try
        run: node sdk/docs/skill.mjs smoke
