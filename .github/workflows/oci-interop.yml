name: OCI interop

# prism-code push and pull against the tools the done criterion of #292 names:
# stock `distribution` registries with cosign and ORAS on every change to this
# code, and GHCR with a keyless signature when someone dispatches it, because
# that job writes a package and asks Sigstore for a certificate.

on:
  pull_request:
    paths:
      - sdk/npm/prism-code/src/oci-*.mjs
      - sdk/npm/prism-code/src/push-pull*.mjs
      - sdk/npm/prism-code/src/attest.mjs
      - sdk/npm/prism-code/test/oci-*.test.mjs
      - sdk/npm/prism-code/test/support/**
      - .github/workflows/oci-interop.yml
  workflow_dispatch:
    inputs:
      repository:
        description: Package to push to, under ghcr.io/<owner>/
        default: prism-interop
        required: true

permissions:
  contents: read

concurrency:
  group: oci-interop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sdk/npm/prism-code

env:
  COSIGN_VERSION: v3.1.4
  ORAS_VERSION: 1.3.4

jobs:
  # The same live tests a developer runs, on a real registry. A registry with no
  # referrers API gets the tag fallback, so stock registries need no server support.
  distribution:
    name: ${{ matrix.name }} with cosign and oras
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: registry 2.8.3
            image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          - name: registry 3.0.0
            image: registry@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    services:
      registry:
        image: ${{ matrix.image }}
        ports:
          - 127.0.0.1:5000:5000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Install the optional sigstore packages
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: The live tests, none of them skipped
        env:
          PRISM_TEST_REGISTRY: 127.0.0.1:5000
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap test/oci-live.test.mjs | tee "$RUNNER_TEMP/live.tap"
          # A tool that went missing must fail this job, not skip its test.
          grep -q '^# skipped 0$' "$RUNNER_TEMP/live.tap"

  # The GHCR half of the done criterion: push the reference holo, signed by this
  # workflow's own identity, and let cosign and ORAS read it back.
  ghcr:
    name: GHCR with a keyless signature
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TYPE: https://example.com/prism/ci-round-trip/v1
      ISSUER: https://token.actions.githubusercontent.com
      IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ env.ORAS_VERSION }}
      - name: Install the optional sigstore packages
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: Name the reference
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ inputs.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "REF=ghcr.io/${OWNER,,}/${PACKAGE}:run-${RUN_ID}" >> "$GITHUB_ENV"
      - name: Log in as Docker does
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Attest the reference holo keyless, then push it keyless
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"run":"%s","note":"push and pull round trip of #292"}\n' "$RUN_ID" > "$RUNNER_TEMP/predicate.json"
          node bin/prism-code.mjs attest fixtures/Calculator.holo \
            --predicate "$RUNNER_TEMP/predicate.json" --type "$TYPE" --output "$RUNNER_TEMP/attested.holo"
          node bin/prism-code.mjs push "$RUNNER_TEMP/attested.holo" "$REF" --keyless
      - name: cosign verify-attestation accepts the same reference
        shell: bash
        run: |
          set -euo pipefail
          cosign verify-attestation "$REF" --type "$TYPE" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > "$RUNNER_TEMP/cosign.jsonl"
          # The statement cosign accepted carries both digests of the blob, beside the manifest's sha256.
          node -e '
            const line = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n")[0];
            const statement = JSON.parse(Buffer.from(JSON.parse(line).payload, "base64"));
            if (statement.subject[0].name !== "oci-manifest") throw new Error("no manifest subject");
            if (!statement.subject[1].digest.blake3 || !statement.subject[1].digest.sha256) throw new Error("no dual digest");
          ' "$RUNNER_TEMP/cosign.jsonl"
      - name: oras discover lists the referrers
        shell: bash
        run: |
          set -euo pipefail
          oras discover --format tree "$REF"
          oras discover --format json --artifact-type application/vnd.dev.sigstore.bundle.v0.3+json "$REF" > "$RUNNER_TEMP/discover.json"
          node -e '
            const found = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const listed = found.referrers ?? found.manifests;
            if (listed.length !== 2) throw new Error(`expected 2 referrers, found ${listed.length}`);
          ' "$RUNNER_TEMP/discover.json"
      - name: pull verifies the signer before it writes
        shell: bash
        run: |
          set -euo pipefail
          node bin/prism-code.mjs pull "$REF" "$RUNNER_TEMP/pulled.holo" --type "$TYPE" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER"
          cmp "$RUNNER_TEMP/attested.holo" "$RUNNER_TEMP/pulled.holo"
          # GitHub runs `bash -e`, so a command that is meant to fail must be guarded.
          code=0
          node bin/prism-code.mjs pull "$REF" "$RUNNER_TEMP/refused.holo" \
            --certificate-identity "${IDENTITY}x" --certificate-oidc-issuer "$ISSUER" || code=$?
          test "$code" -eq 1
          test ! -e "$RUNNER_TEMP/refused.holo"
      - name: The GHCR token works without Docker's config, and the fingerprint is an address
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          fingerprint=$(node -e 'const f = require("fs").readFileSync(process.argv[1]); console.log(f.subarray(f.length - 32).toString("hex"))' "$RUNNER_TEMP/attested.holo")
          node bin/prism-code.mjs pull "${REF%:*}@blake3:${fingerprint}" "$RUNNER_TEMP/by-fingerprint.holo"
          cmp "$RUNNER_TEMP/attested.holo" "$RUNNER_TEMP/by-fingerprint.holo"
