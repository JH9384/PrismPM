name: Honesty Gate

# Also included in both complete vv.yml passes; these checks remain additive.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honesty-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  honesty:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate the model, claims, diagnostics, and audits
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: cargo xtask validate
