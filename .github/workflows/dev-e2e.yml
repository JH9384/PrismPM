name: dev end to end

# Issue #288's acceptance, measured on a clean runner:
#   offline   the studio in a real browser, in a network namespace with only
#             loopback, so nothing it asks for from outside can arrive
#   measure   edit to verdict on each reference archive with the real build in the SDK image.
#             A verdict on new source costs one hermetic build, so the job compares
#             each edit with this run's own cold build, and holds the time the loop
#             adds on top of it (docs/proposals/288-prism-dev.md, The floor)
#
# It pulls a multi-gigabyte image, so it runs only on changes to the verb. No SDK
# release exists yet (#194): the image is a development candidate until one does.

on:
  pull_request:
    paths:
      - sdk/npm/prism-code/src/dev*.mjs
      - sdk/npm/prism-code/src/studio/**
      - sdk/npm/prism-code/scripts/dev-measure.mjs
      - .github/workflows/dev-e2e.yml
  workflow_dispatch:
    inputs:
      sdk_image:
        description: SDK image to build with, NAME@sha256:DIGEST
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: dev-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # sdk-candidate.yml's build of 1010e48d.
  SDK_IMAGE: ${{ inputs.sdk_image || 'ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:81e6bc91fffb077608e906cdcdd4047ae45e2d96a5b09382c221387e0b93382b' }}

jobs:
  offline:
    name: the studio with no network
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Measure the loop in a browser, in a namespace with only loopback
        shell: bash
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" unshare -n sh -ec '
            ip link set lo up
            if curl --silent --max-time 5 https://github.com > /dev/null; then
              echo "this namespace reaches the network, so the test would prove nothing" >&2
              exit 1
            fi
            node sdk/npm/prism-code/scripts/dev-measure.mjs --stand-in --edits 4 \
              --chrome "$(command -v google-chrome)" --summary "$GITHUB_STEP_SUMMARY"
          '

  measure:
    name: edit to verdict on ${{ matrix.project }}, real build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each edit is to text no theorem or acceptance vector reads, so the build still succeeds.
          - project: Calculator
            from: Enter a signed 64-bit integer.
            to: Enter a signed 64 bit integer.
          - project: PaymentApproval
            from: a payment approval decision over a requester role
            to: a payment approval decision over the requester's role
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Admit only an immutable image reference
        run: |
          [[ "$SDK_IMAGE" =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]
      - name: Log in to GHCR (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Cache the SDK image (not timed)
        run: docker pull "$SDK_IMAGE"
      - name: Bind a copy of the project to the image
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/$PROJECT"
          cp -a "examples/$PROJECT" "$work"
          cd "$work"
          docker run --rm --network none --entrypoint cat "$SDK_IMAGE" /opt/prismpm/share/standards.lock > standards.lock
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,size=2g --volume "$PWD:$PWD" --workdir "$PWD" \
            --env HOME=/tmp/prismpm-home --env PRISMPM_EPHEMERAL_HOME=1 "$SDK_IMAGE" prismpm update --toolchain "$SDK_IMAGE"
      - name: Measure edit to verdict
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          EDIT_FROM: ${{ matrix.from }}
          EDIT_TO: ${{ matrix.to }}
        run: |
          set -euo pipefail
          node sdk/npm/prism-code/scripts/dev-measure.mjs \
            --project "$RUNNER_TEMP/$PROJECT" \
            --from "$EDIT_FROM" --to "$EDIT_TO" \
            --edits 4 --chrome "$(command -v google-chrome)" \
            --cold-factor 1.25 --overhead-seconds 2 --summary "$GITHUB_STEP_SUMMARY"
