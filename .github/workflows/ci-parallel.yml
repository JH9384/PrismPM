name: PR Fast Checks

# The one per-PR check set: three jobs, each bounded to the longest measured
# run plus margin, so a typical PR gets a result in well under 45 minutes using
# at most three runners. Every PR runs exactly this set whatever its base, so
# stacked PRs (base other than main) are not qualified more heavily than any
# other PR. The complete 15-gate verification (unit tests, all conformance
# suites, Lean proofs, packaging, reproducibility) runs once per main push or
# release tag in vv.yml and can be started on any head with workflow_dispatch.
on:
  pull_request:
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer-image:
    name: Devcontainer image cache
    runs-on: ubuntu-24.04
    # Builds the pinned devcontainer once per run, filling the layer cache that
    # the three checks below import. With unchanged inputs every layer is a
    # cache hit and no package, toolchain or oracle download happens.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - name: Build or reuse the devcontainer layers
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          cacheTo: ${{ steps.cache.outputs.cache-to }}
          runCmd: "true"

  lint-and-policy:
    needs: devcontainer-image
    name: Lint & Dependency Policy
    runs-on: ubuntu-24.04
    # Measured 16-22 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - name: Format, Clippy & Cargo Deny
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            set -euo pipefail
            cargo fmt --check
            cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
            cargo deny --frozen --all-features check

  model-and-audits:
    needs: devcontainer-image
    name: Model & Audits
    runs-on: ubuntu-24.04
    # Measured 30-34 minutes. This job also replaces the former Honesty Gate
    # workflow, which ran the identical `cargo xtask validate` on every PR.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - name: Check bootstrap source and validate
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            set -euo pipefail
            bash scripts/bootstrap-verify.sh --check-source
            cargo xtask validate

  fixtures-and-golden:
    needs: devcontainer-image
    name: Fixtures & Reviewed Golden Outputs
    runs-on: ubuntu-24.04
    # Measured about 30 minutes.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - name: Check Fixtures, Oracle & Golden Bytes
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            set -euo pipefail
            cargo xtask check-fixtures
            cargo run --locked --offline --manifest-path tests/holo-codec-oracle/Cargo.toml --target-dir target/holo-codec-oracle
            cargo xtask check-golden
